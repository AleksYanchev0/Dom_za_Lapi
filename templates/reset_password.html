{% extends "base.html" %}
{% block title %}Нова парола{% endblock %}

{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        margin-top: 60px;
    }
    .auth-card {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    .auth-card h2 { text-align: center; color: #27ae60; margin-bottom: 25px; }
    .auth-card label { display: block; margin-bottom: 6px; font-weight: 500; }
    .auth-card input {
        width: 100%;
        padding: 10px;
        margin-bottom: 18px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }
    .auth-card button {
        width: 100%;
        padding: 12px;
        background-color: #27ae60;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    .auth-card button:hover { background-color: #219150; }
    .message { text-align: center; margin-top: 10px; font-size: 14px; }
    .message.success { color: #27ae60; }
    .message.error { color: red; }
    .expired { text-align: center; color: #e74c3c; }
    .expired a { color: #27ae60; text-decoration: none; font-weight: 500; }
</style>

<section class="auth-wrapper">
    <article class="auth-card">

        <div id="mainForm">
            <h2>Нова парола</h2>
            <form id="form">
                <label for="password">Нова парола</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <label for="confirm_password">Потвърди паролата</label>
                <input type="password" id="confirm_password" placeholder="••••••••" required>
                <button type="submit">Смени паролата</button>
            </form>
            <p id="message" class="message"></p>
        </div>

        <div id="expiredState" class="expired" style="display:none;">
            <p>⚠️ Линкът е невалиден или е изтекъл.</p>
            <a href="/forgot_password">Поискай нов линк</a>
        </div>

    </article>
</section>
{% endblock %}

{% block scripts %}
<script>
    const token = new URLSearchParams(window.location.search).get("token")

    if (!token) {
        document.getElementById("mainForm").style.display = "none"
        document.getElementById("expiredState").style.display = "block"
    }

    document.getElementById("form").addEventListener("submit", async function(event) {
        event.preventDefault()

        const password = document.getElementById("password").value
        const confirm_password = document.getElementById("confirm_password").value
        const msg = document.getElementById("message")

        if (!password || !confirm_password) {
            msg.className = "message error"
            msg.innerText = "Попълни двете полета."
            return
        }

        if (password !== confirm_password) {
            msg.className = "message error"
            msg.innerText = "Паролите не съвпадат."
            return
        }

        if (password.length < 8) {
            msg.className = "message error"
            msg.innerText = "Паролата трябва да е поне 8 символа."
            return
        }

        const response = await fetch("/auth/reset_password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password, token })
        })

        const data = await response.json()

        if (data.success) {
            msg.className = "message success"
            msg.innerText = "Паролата е сменена! Пренасочване..."
            setTimeout(() => window.location.href = "/login", 2000)
        } else {
            if (response.status === 400) {
                document.getElementById("mainForm").style.display = "none"
                document.getElementById("expiredState").style.display = "block"
            } else {
                msg.className = "message error"
                msg.innerText = data.error || "Нещо се обърка."
            }
        }
    })
</script>
{% endblock %}
