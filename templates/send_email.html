{% extends "base.html" %}
{% block title %}Забравена парола{% endblock %}

{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        margin-top: 60px;
    }
    .auth-card {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    .auth-card h2 { text-align: center; color: #27ae60; margin-bottom: 25px; }
    .auth-card label { display: block; margin-bottom: 6px; font-weight: 500; }
    .auth-card input {
        width: 100%;
        padding: 10px;
        margin-bottom: 18px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }
    .auth-card button {
        width: 100%;
        padding: 12px;
        background-color: #27ae60;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    .auth-card button:hover { background-color: #219150; }
    .auth-footer { text-align: center; margin-top: 15px; }
    .auth-footer a { color: #27ae60; text-decoration: none; font-weight: 500; }
    .message { text-align: center; margin-top: 10px; font-size: 14px; }
    .message.success { color: #27ae60; }
    .message.error { color: red; }
</style>

<section class="auth-wrapper">
    <article class="auth-card">
        <h2>Забравена парола</h2>

        <form id="form">
            <label for="email">Имейл адрес</label>
            <input type="email" id="email" placeholder="example@email.com" required>
            <button type="submit">Изпрати линк</button>
        </form>

        <p id="message" class="message"></p>

        <div class="auth-footer">
            <a href="/login">← Назад към влизане</a>
        </div>
    </article>
</section>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById("form")

    form.addEventListener("submit", async function(event) {
        event.preventDefault()
        const email = document.getElementById("email").value
        const msg = document.getElementById("message")

        const response = await fetch("/auth/forgot_password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        })

        const data = await response.json()

        if (data.success) {
            msg.className = "message success"
            msg.innerText = "Линкът беше изпратен! Провери имейла си."
        } else {
            msg.className = "message error"
            msg.innerText = data.error || "Нещо се обърка."
        }
    })
</script>
{% endblock %}
