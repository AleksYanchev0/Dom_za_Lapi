{% extends "base.html" %}

{% block title %}Сигнали{% endblock %}

{% block content %}
<h1>Сигнали</h1>

<ul>
    {% for report in reports %}
        <li>
            {{ report.text }} <br>
            Статус: {{ report.status }} <br>
            Дата: {{ report.created_at }}
        </li>
        <hr>
    {% endfor %}
</ul>
{% endblock %}
