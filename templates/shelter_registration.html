{% extends "base.html" %}
{% block title %}Регистрация на приют{% endblock %}

{% block content %}

<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        margin-top: 60px;
        margin-bottom: 60px;
    }

    .auth-card {
        width: 450px;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .auth-card h2 {
        text-align: center;
        color: #27ae60;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .auth-card label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
    }

    .auth-card input {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    .optional-label {
        font-size: 12px;
        color: #999;
        font-weight: normal;
    }

    .auth-card button {
        width: 100%;
        padding: 12px;
        background-color: #27ae60;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .auth-card button:hover {
        background-color: #219150;
    }

    .auth-footer {
        text-align: center;
        margin-top: 15px;
    }

    .auth-footer a {
        color: #27ae60;
        text-decoration: none;
        font-weight: 500;
    }

    .error {
        color: red;
        text-align: center;
        margin-top: 10px;
    }

    .success {
        color: #27ae60;
        text-align: center;
        margin-top: 10px;
    }

    .section-title {
        font-size: 13px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 20px 0 10px;
        border-bottom: 1px solid #eee;
        padding-bottom: 5px;
    }

    .photo-preview {
        margin-top: 8px;
        display: none;
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #ddd;
    }
</style>

<section class="auth-wrapper">
    <article class="auth-card">
        <h2>Регистрация на приют</h2>

        <form id="shelterForm">

            <div class="section-title">Информация за приюта</div>

            <div class="form-group">
                <label for="name">Име на приюта</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="city">Град</label>
                <input type="text" id="city" required>
            </div>

            <div class="form-group">
                <label for="phone">Телефон <span class="optional-label">(незадължително)</span></label>
                <input type="text" id="phone" placeholder="+359...">
            </div>

            <div class="form-group">
                <label for="photo_url">Снимка на приюта <span class="optional-label">(незадължително)</span></label>
                <input type="url" id="photo_url" placeholder="https://...">
                <img id="photoPreview" class="photo-preview" alt="Преглед на снимката">
            </div>

            <div class="section-title">Акаунт</div>

            <div class="form-group">
                <label for="username">Потребителско име</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="email">Имейл</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Парола</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit">Регистрирай приют</button>
        </form>

        <p id="error" class="error"></p>
        <p id="success" class="success"></p>

        <div class="auth-footer">
            <p>Искаш стандартен акаунт?
                <a href="{{ url_for('auth.register_page') }}">Регистрирай се тук.</a>
            </p>
        </div>
    </article>
</section>

{% endblock %}


{% block scripts %}
<script>
document.getElementById("photo_url").addEventListener("input", function() {
    const preview = document.getElementById("photoPreview");
    const url = this.value.trim();
    if (url) {
        preview.src = url;
        preview.style.display = "block";
        preview.onerror = () => preview.style.display = "none";
    } else {
        preview.style.display = "none";
    }
});

document.getElementById("shelterForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const errorElement = document.getElementById("error");
    const successElement = document.getElementById("success");
    errorElement.innerText = "";
    successElement.innerText = "";

    const name = document.getElementById("name").value.trim();
    const city = document.getElementById("city").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const photo_url = document.getElementById("photo_url").value.trim();
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!name || !city || !email || !password || !username) {
        errorElement.innerText = "Всички задължителни полета трябва да бъдат попълнени.";
        return;
    }

    try {
        const res = await fetch("{{ url_for('shelter.create_shelter') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name, city, phone: phone || null, photo_url: photo_url || null, username, email, password
            })
        });

        const data = await res.json();

        if (!res.ok) {
            errorElement.innerText = data.error || "Възникна грешка.";
            return;
        }

        successElement.innerText = "Приютът беше регистриран успешно! Изчаква одобрение от администратор.";

        setTimeout(() => {
            window.location.href = "{{ url_for('auth.login_page') }}";
        }, 2000);

    } catch (err) {
        errorElement.innerText = "Сървърна грешка.";
    }
});
</script>
{% endblock %}
