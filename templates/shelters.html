{% extends "base.html" %}
{% block title %}Приюти{% endblock %}

{% block content %}
<h1>Списък на приютите</h1>

{% for shelter in shelters %}
    <div class="card">
        <h3>{{ shelter.name }}</h3>
        <p>Град: {{ shelter.city }}</p>
        <a href="/shelters/{{ shelter.id }}?view=html">
            Виж детайли →
        </a>
    </div>
{% endfor %}

{% endblock %}
